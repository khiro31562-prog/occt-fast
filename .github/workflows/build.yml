        run: |
          git clone --quiet https://github.com/kovacsv/occt-import-js.git src
          git -C src checkout --quiet "$OCCT_IMPORT_JS_COMMIT"
          rm -rf src/occt && mkdir -p src/occt
          cd src/occt
          git init --quiet
          git remote add origin https://github.com/Open-Cascade-SAS/OCCT.git
          git fetch --quiet --depth 1 origin "$OCCT_COMMIT"
          git checkout --quiet FETCH_HEAD
          echo "OCCT modules: $(ls src | wc -l)"
          cd ../..
          echo 'target_link_options (OcctImportJS PUBLIC -sFORCE_FILESYSTEM=1)' >> src/CMakeLists.txt

      - name: 3. 改変前ファイルの一致確認
        run: |
          cd src/occt-import-js/src
          sha256sum -c ../../../kit/patch/BASE_SHA256.txt

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 4. ツール準備（Emscripten / CMake）
        run: |
          pip install --quiet cmake==3.31.6
          git clone --quiet --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "$EMSDK_VERSION" > emsdk.log 2>&1 || (tail -n 50 emsdk.log; exit 1)
          ./emsdk/emsdk activate "$EMSDK_VERSION" > /dev/null
          source ./emsdk/emsdk_env.sh > /dev/null 2>&1
          emcc --version | head -n 1
          cmake --version | head -n 1

      - name: 5. ビルド① 無改造版（比較の基準。OpenCASCADE 全体をコンパイルするので時間がかかります）
        run: |
          source ./emsdk/emsdk_env.sh > /dev/null 2>&1
          cd src
          emcmake cmake -B build/wasm -G "Unix Makefiles" -DEMSCRIPTEN=1 -DCMAKE_BUILD_TYPE=Release . > ../build1.log 2>&1 || (tail -n 80 ../build1.log; exit 1)
          emmake make -C build/wasm -j"$(nproc)" >> ../build1.log 2>&1 || (tail -n 120 ../build1.log; exit 1)
          mkdir -p ../out/baseline
          cp build/wasm/Release/occt-import-js.js build/wasm/Release/occt-import-js.wasm ../out/baseline/
          ls -la ../out/baseline

      - name: 6. ビルド② 安全版（高速検索＋深い階層）
        run: |
          source ./emsdk/emsdk_env.sh > /dev/null 2>&1
          cp kit/patch/importer.hpp kit/patch/importer-xcaf.hpp kit/patch/importer-xcaf.cpp kit/patch/writer.hpp kit/patch/writer.cpp src/occt-import-js/src/
          emmake make -C src/build/wasm -j"$(nproc)" > build2.log 2>&1 || (tail -n 120 build2.log; exit 1)
          mkdir -p out/safe
          cp src/build/wasm/Release/occt-import-js.js src/build/wasm/Release/occt-import-js.wasm out/safe/
          ls -la out/safe

      - name: 7. ビルド③ 高速I/O版＋HLR（DXF 出力用 ProjectFile。失敗したらワークフロー全体を失敗にします）
        run: |
          source ./emsdk/emsdk_env.sh > /dev/null 2>&1
          cp kit/patch/js-interface.cpp kit/patch/projector.hpp kit/patch/projector.cpp kit/patch/importer.hpp kit/patch/writer.hpp kit/patch/writer.cpp src/occt-import-js/src/
          emmake make -C src/build/wasm -j"$(nproc)" > build3.log 2>&1 || (tail -n 120 build3.log; exit 1)
          mkdir -p out/fastio
          cp src/build/wasm/Release/occt-import-js.js src/build/wasm/Release/occt-import-js.wasm out/fastio/
          ls -la out/fastio

      - name: 8. 検証用の大規模モデル生成（約 1,100 部品 / 4,300 部品。失敗しても続行）
        continue-on-error: true
        run: |
          pip install --quiet cadquery==2.8.0
          python kit/tools/gen_test_models.py 8 testmodels
          python kit/tools/gen_test_models.py 30 testmodels

      - name: 9. 検証（無改造版と結果を比較・速度測定）
        run: |
          shopt -s nullglob
          mkdir -p dist
          T=src/test/testfiles
          if node kit/tools/verify.cjs out dist/report.md \
              "$T/cax-if/as1-oc-214.stp" "$T/cax-if/as1_pe_203.stp" "$T/cax-if/as1-tu-203.stp" \
              "$T/cax-if/dm1-id-214.stp" "$T/cax-if/dm1-oc-214.stp" "$T/cax-if/io1-cm-214.stp" \
              "$T/cax-if/io1-tu-203.stp" "$T/cax-if/sg1-c5-214.stp" "$T/rounded-cube/rounded-cube.step" \
              "$T/cube-10x10mm/Cube 10x10.igs" "$T/cax-if-brep/as1_pe_203.brep" \
              testmodels/*.step; then
            echo "VERIFY_OK=1" >> "$GITHUB_ENV"
          fi
          [ -f dist/report.md ] && cat dist/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 10. ビューワー用バンドル作成
        if: env.VERIFY_OK == '1'
        run: |
          BEST=$(cat dist/best.txt)
          if [ "$BEST" != "fastio" ]; then
            echo "::error::高速I/O+HLR 版が検証に通らなかったため、バンドルを作りません（BEST=$BEST）。Artifacts の build-logs を Claude に渡してください。"
            exit 1
          fi
          python kit/tools/make_bundle.py "out/$BEST" dist/occt-bundle.js "0.0.24-fast-$BEST-hlr-w"
          mkdir -p dist/raw && cp -r "out/$BEST" "dist/raw/$BEST"
          cp "kit/README_成果物.txt" dist/README.txt

      - name: 11. 成果物のアップロード
        if: env.VERIFY_OK == '1'
        uses: actions/upload-artifact@v7
        with:
          name: occt-fast-engine
          path: dist/
          retention-days: 30

      - name: 失敗時のログ保存
        if: failure() || env.VERIFY_OK != '1'
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            *.log
            dist/
          if-no-files-found: ignore
          retention-days: 30

      - name: 結果判定
        if: env.VERIFY_OK != '1'
        run: |
          echo "::error::検証に失敗しました。Artifacts の build-logs を Claude に渡してください。"
          exit 1
