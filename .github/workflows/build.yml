# ============================================================================
#  高速版 OCCT エンジン 自動ビルド（Offline STEP Viewer 用）
#  ・このファイルを GitHub リポジトリの .github/workflows/build.yml に置くだけで
#    クラウド上で自動的にビルド → 検証 → 成果物（occt-bundle.js）作成まで行います。
#  ・所要時間の目安：公開リポジトリで約 30 分（非公開だと 1.5〜2 倍）
#  ・起動：Actions タブの「Run workflow」、またはこのファイル自体を更新したとき
#  ・改変ソース一式は下の「1. キット展開」に埋め込まれています（LGPL-2.1）。
# ============================================================================
name: Build fast OCCT engine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      OCCT_IMPORT_JS_COMMIT: 41e470890ae0f9dc69ac50ffd5fc73e03576f4eb   # occt-import-js 0.0.24
      OCCT_COMMIT: d2abb6d844231cb8f29be6894440874a4700e4a5             # OpenCASCADE 7.6.1
      EMSDK_VERSION: 3.1.69                                             # upstream と同じ版
